<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>Abu Noura – Chat Games Interactive</title>
<style>
  body { background-color: #2e0057; color: #fff; font-family: Arial; text-align: center; padding: 20px;}
  h1 { font-size: 50px; margin-bottom: 10px;}
  #output { margin-top:30px; font-size:35px; min-height:150px;}
  button { font-size:20px; padding:10px 20px; margin:5px; border:none; border-radius:10px; background:#7200b8; color:#fff; cursor:pointer;}
  button:hover { background:#9d3fff;}
  #languageToggle { position:fixed; top:20px; right:20px; padding:10px 20px; background-color:#9d3fff; }
  #players { margin-top:20px; font-size:25px; color:#ffd700;}
</style>
</head>
<body>

<h1>Abu Noura</h1>
<button id="languageToggle">🇸🇦 / 🇺🇸</button>

<div>
  <button onclick="runCommand('question')">❓ سؤال عشوائي</button>
  <button onclick="runCommand('challenge')">🔥 تحدي</button>
  <button onclick="runCommand('roulette')">🎡 Russian Roulette</button>
  <button onclick="runCommand('words')">🧠 الكلمات</button>
  <button onclick="runCommand('lettergrid')">🔤 خلية الحروف</button>
  <button onclick="runCommand('spy')">🕵️‍♂️ الجاسوس</button>
</div>

<div id="output">اضغط أي زر أو استخدم أوامر الشات!</div>
<div id="players">اللاعبون: لا أحد بعد</div>

<script src="https://cdn.jsdelivr.net/npm/tmi.js@1.8.5/dist/tmi.min.js"></script>
<script>
let language = 'ar';
const channelName = 'اسم_قناتك'; // <-- ضع اسم قناتك على Twitch
const players = [];

// تهيئة اتصال Twitch
const client = new tmi.Client({ channels: [ channelName ] });
client.connect();

// الألعاب والبيانات
const questions = {
  ar:["أكثر واحد يضيع جواله؟","أكثر واحد يتأخر عن المواعيد؟","أكثر واحد ينام بالبث؟"],
  en:["Who is most likely to lose their phone?","Who is most likely to be late?","Who is most likely to sleep during the stream?"]
};
const challenges = {
  ar:["ابتسم 10 ثواني 😁","غيّر صوتك 15 ثانية 🎙️","اسكت 20 ثانية 😶"],
  en:["Smile 10 sec 😁","Change your voice 15 sec 🎙️","Stay silent 20 sec 😶"]
};
const roulette = {
  ar:["نجوت! 😎","ابتسم 10 ثواني 😁","غيّر صوتك 15 ثانية 🎙️","اسكت 20 ثانية 😶"],
  en:["You survived! 😎","Smile 10 sec 😁","Change voice 15 sec 🎙️","Stay silent 20 sec 😶"]
};
const classicWords = { ar:["بحر","رمل","قمر"], en:["Sea","Sand","Moon"] };
const letterGridArr = {
  ar:["ب ح ل م ك","س ر ن ا ي","ق ط و ر ت","ج م ع ي ن","ش و ل ب ك"],
  en:["S E A M D","F R U I T","C A T S Y","B O O K S","P L A Y X"]
};
const spyWords = {
  ar:["تفاح","موز","برتقال","جاسوس"], 
  en:["Apple","Banana","Orange","Spy"]
};

// دوال مساعدة
function getRandom(arr){ return arr[Math.floor(Math.random()*arr.length)]; }

function addPlayer(username){
  if(!players.includes(username)){
    players.push(username);
    document.getElementById("players").innerText = "اللاعبون: " + players.join(", ");
  }
}

function runCommand(cmd){
  let text = "";
  switch(cmd){
    case 'question': text=getRandom(questions[language]); break;
    case 'challenge': text=getRandom(challenges[language]); break;
    case 'roulette': text=getRandom(roulette[language]); break;
    case 'words': text=getRandom(classicWords[language]); break;
    case 'lettergrid': text=getRandom(letterGridArr[language]); break;
    case 'spy': text=getRandom(spyWords[language]); break;
    default: return;
  }
  document.getElementById("output").innerText = text;
}

// قراءة أوامر الشات وإضافة اللاعبين
client.on('message', (channel, tags, message, self) => {
  if(self) return;
  const msg = message.trim().toLowerCase();
  if(msg.startsWith('!')) addPlayer(tags.username);
  if(msg === '!question') runCommand('question');
  if(msg === '!challenge') runCommand('challenge');
  if(msg === '!roulette') runCommand('roulette');
  if(msg === '!words') runCommand('words');
  if(msg === '!lettergrid') runCommand('lettergrid');
  if(msg === '!spy') runCommand('spy');
});

// تبديل اللغة
document.getElementById("languageToggle").addEventListener("click", ()=>{
  language = language==='ar'?'en':'ar';
  document.getElementById("output").
